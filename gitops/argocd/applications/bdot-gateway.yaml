apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bdot-gateway
  namespace: argocd
spec:
  project: observability-platform
  source:
    repoURL: https://github.com/<YOUR_GIT_REPO_URL>.git
    targetRevision: main
    path: charts/bdot-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: bdot-gateway
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
