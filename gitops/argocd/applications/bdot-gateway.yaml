apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bdot-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/snakka-ops/obs-platform.git
    targetRevision: main
    path: charts/bdot-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: bdot-gateway
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
