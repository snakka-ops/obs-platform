---
# Source: bdot-gateway/templates/namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: bdot-gateway
---
# Source: bdot-gateway/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-collectors
  namespace: bdot-gateway
---
# Source: bdot-gateway/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-collectors
  namespace: bdot-gateway
  labels:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/name: gateway-collectors
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
      app.kubernetes.io/name: gateway-collectors
  template:
    metadata:
      annotations:
        prometheus.io/job-name: gateway-collectors
        prometheus.io/path: /metrics
        prometheus.io/port: "8888"
        prometheus.io/scheme: http
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/component: gateway
        app.kubernetes.io/name: gateway-collectors
    spec:
      serviceAccountName: gateway-collectors
      terminationGracePeriodSeconds: 500
      securityContext:
        fsGroup: 1e+09
        runAsGroup: 1e+09
        runAsNonRoot: true
        runAsUser: 1e+09
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - gateway-collectors
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - gateway
      initContainers:
        - name: setup-volumes
          image: ghcr.io/observiq/bindplane-agent:1.94.2
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo '
              receivers:
                nop:
              processors:
                batch:
              exporters:
                nop:
              service:
                pipelines:
                  metrics:
                    receivers: [nop]
                    processors: [batch]
                    exporters: [nop]
                telemetry:
                  metrics:
                    level: none
              ' > /etc/otel/storage/config.yaml
              echo '
              output: stdout
              level: info
              ' > /etc/otel/storage/logging.yaml
          resources:
            requests:
              cpu: "100m"
              memory: "200Mi"
            limits:
              memory: "200Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsGroup: 1e+09
            runAsNonRoot: true
            runAsUser: 1e+09
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: gateway-collectors-storage
              mountPath: /etc/otel/storage
      containers:
        - name: opentelemetry-container
          image: ghcr.io/observiq/bindplane-agent:1.94.2
          imagePullPolicy: IfNotPresent
          env:
            - name: OPAMP_ENDPOINT
              value: "ws://bindplane.bindplane:3001/v1/opamp"
            - name: OPAMP_SECRET_KEY
              value: "01KMTG2ARNJTETH6MSQ4ERRCA7"
            - name: OPAMP_AGENT_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: OPAMP_LABELS
              value: "container-platform=kubernetes-gateway,fleet=bdot-gateway"
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: CONFIG_YAML_PATH
              value: /etc/otel/storage/config.yaml
            - name: MANAGER_YAML_PATH
              value: /etc/otel/config/manager.yaml
            - name: LOGGING_YAML_PATH
              value: /etc/otel/storage/logging.yaml
          ports:
            - name: prometheus
              containerPort: 8888
              protocol: TCP
          resources:
            requests:
              cpu: "250m"
              memory: "500Mi"
            limits:
              memory: "500Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsGroup: 1e+09
            runAsNonRoot: true
            runAsUser: 1e+09
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: gateway-collectors-storage
              mountPath: /etc/otel/storage
            - name: config
              mountPath: /etc/otel/config
      volumes:
        - name: config
          emptyDir: {}
        - name: gateway-collectors-storage
          emptyDir: {}
