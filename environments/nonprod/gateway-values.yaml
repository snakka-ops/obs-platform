namespace: bdot-gateway

serviceAccount:
  name: gateway-collectors

deployment:
  name: gateway-collectors
  replicas: 2

image:
  repository: ghcr.io/observiq/bindplane-agent
  tag: "1.94.2"
  pullPolicy: IfNotPresent

opamp:
  endpoint: ws://bindplane.bindplane:3001/v1/opamp
  secretKey: "01KMTG2ARNJTETH6MSQ4ERRCA7"
  labels: "container-platform=kubernetes-gateway,fleet=bdot-gateway"

service:
  enabled: false
  name: bdot-gateway
  type: ClusterIP
  port: 8888

pdb:
  enabled: true
  minAvailable: 1

